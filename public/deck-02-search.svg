<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#080b13"/><stop offset="1" stop-color="#17122c"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/><text x="110" y="110" fill="#73e7f5" font-family="monospace" font-size="24" letter-spacing="5">BACKTRACK / STEP 01</text><text x="110" y="215" fill="#f3fbff" font-family="Arial" font-size="72" font-weight="700">Ask a question in plain English.</text><text x="110" y="285" fill="#9fb2b9" font-family="Arial" font-size="32">BackTrack searches across the entire camera set for the moment you describe.</text><rect x="110" y="385" width="1380" height="125" rx="62" fill="#101d28" stroke="#4bd2e8" stroke-width="3"/><circle cx="185" cy="447" r="22" fill="none" stroke="#f4ca5c" stroke-width="7"/><path d="M202 464l24 24" stroke="#f4ca5c" stroke-width="7"/><text x="275" y="460" fill="#e6faff" font-family="Arial" font-size="35">“What happened near the front door?”</text><g font-family="Arial" font-size="30"><rect x="110" y="600" width="395" height="95" rx="12" fill="#11313b"/><text x="155" y="658" fill="#77e7f3">1. Describe the event</text><path d="M540 647h120" stroke="#f4ca5c" stroke-width="5"/><path d="M650 632l24 15-24 15" fill="none" stroke="#f4ca5c" stroke-width="5"/><rect x="710" y="600" width="395" height="95" rx="12" fill="#11313b"/><text x="755" y="658" fill="#77e7f3">2. Find matching footage</text><path d="M1140 647h120" stroke="#f4ca5c" stroke-width="5"/><path d="M1250 632l24 15-24 15" fill="none" stroke="#f4ca5c" stroke-width="5"/><rect x="1310" y="600" width="180" height="95" rx="12" fill="#3a2f18"/><text x="1345" y="658" fill="#f4ca5c">3. Jump in</text></g><text x="110" y="790" fill="#8da3ad" font-family="monospace" font-size="25" letter-spacing="3">NO CAMERA-BY-CAMERA SCRUBBING</text></svg>
