<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#070b13"/><stop offset="1" stop-color="#17122c"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/><g opacity=".14" stroke="#56d9ef"><path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/></g><text x="110" y="110" fill="#73e7f5" font-family="monospace" font-size="24" letter-spacing="5">BACKTRACK / THE PROBLEM</text><text x="110" y="215" fill="#f3fbff" font-family="Arial" font-size="68" font-weight="700">Camera footage shows everything.</text><text x="110" y="300" fill="#f3fbff" font-family="Arial" font-size="68" font-weight="700">Finding one moment is the hard part.</text><rect x="110" y="405" width="1380" height="270" rx="18" fill="#0b1720" stroke="#2f9fb2" stroke-width="2"/><text x="165" y="485" fill="#f4ca5c" font-family="Arial" font-size="34" font-weight="700">THE OLD WAY</text><text x="165" y="545" fill="#c5d3d8" font-family="Arial" font-size="30">Open each camera. Scrub every timeline.</text><text x="165" y="595" fill="#c5d3d8" font-family="Arial" font-size="30">Guess where the event began. Repeat.</text><path d="M900 505h360M900 575h280" stroke="#42616b" stroke-width="16" stroke-linecap="round"/><text x="900" y="640" fill="#8da3ad" font-family="monospace" font-size="22">12 CAMERAS  ×  MANUAL SEARCH</text><text x="110" y="790" fill="#8da3ad" font-family="monospace" font-size="25" letter-spacing="3">BACKTRACK TURNS FOOTAGE INTO AN INVESTIGATION</text></svg>
